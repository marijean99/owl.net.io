<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Archive</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #c2dff5;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #111;
      line-height: 1.6;
    }

    #canvas {
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .list {
      font-size: 13px;
    }

    .list h3 {
      margin: 0 0 8px 0;
      font-weight: normal;
      text-decoration: underline;
    }

    .list ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .list a {
      color: inherit;
      text-decoration: none;
    }

    .list li {
      margin-bottom: 4px;
    }

    .list li:hover {
      text-decoration: underline;
    }

    .items {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .item img {
      width: 80px;
      cursor: pointer;
    }

    .description {
      font-size: 12px;
      opacity: 0.8;
    }

    #surprise {
      align-self: center;
      background: transparent;
      border: 1px solid #111;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
    }

    .contact a {
      display: block;
      font-size: 12px;
      color: inherit;
      text-decoration: none;
      margin-top: 6px;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    /* ----- Mobile optimization ----- */
    @media (max-width: 480px) {
      #canvas {
        padding: 20px 16px 32px;
        gap: 32px;
      }

      .list {
        font-size: 14px;
      }

      .list h3 {
        margin-bottom: 10px;
      }

      .items {
        gap: 12px;
      }

      .item img {
        width: 72px;
      }

      #surprise {
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="canvas">

    <nav class="list">
      <h3>Our World,</h3>
      <ul>
        <li>Drink Gift</li>
        <li>(so)lucky draw</li>
        <li>Gatcha!</li>
        <li>and...</li>
      </ul>
    </nav>

    <nav class="list">
      <h3>Networklove (4)</h3>
      <ul>
        <li><a href="https://instagram.com/joshu_acoustic">JOSHUA</a></li>
        <li><a href="https://instagram.com/junhui_moon">JUN</a></li>
        <li><a href="https://instagram.com/xuminghao_o">THE8</a></li>
        <li><a href="https://instagram.com/vernonline">VERNON</a></li>
      </ul>
    </nav>

    <nav class="list">
      <h3>Location</h3>
      <ul>
        <li>서울시 마포구<br>Network Post Office<br>다이버시티</li>
      </ul>
    </nav>

    <div class="items">
      <div class="item"><img src="https://placehold.co/80x80" alt=""></div>
      <div class="item"><img src="https://placehold.co/80x80" alt=""></div>
      <div class="item"><img src="https://placehold.co/80x80" alt=""></div>
    </div>

    <div class="description">Welcome! This is</div>

    <button id="surprise">surprise me</button>

    <div class="contact">
      <a href="https://x.com/nwloversclub">X</a>
      <a href="https://spin-spin.com/OwlneT">spin-spin</a>
    </div>

  </div>
</body>
</html>
